# Scrapes the API's /metrics on the compose network (the proxy never routes it, see deploy/Caddyfile).
# Started by docker-compose.monitoring.yml.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    # X-API-Key value is written to this file at container startup, not stored here
    http_headers:
      X-API-Key:
        files: ["/prometheus-secrets/api_key"]
    static_configs:
      - targets: ["api:8000"]

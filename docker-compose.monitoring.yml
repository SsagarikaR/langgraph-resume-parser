services:
  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/prometheus-secrets]
    entrypoint: ["/bin/sh", "-c"]
    # Picks a scrape key: the single API_KEY if set, else the first plaintext entry in API_KEYS
    # (a sha256:-hashed entry has no usable plaintext, so those are skipped).
    command:
      - |
        key="$$API_KEY"
        if [ -z "$$key" ]; then
          IFS=','
          for pair in $$API_KEYS; do
            rest="$${pair#*:}"
            case "$$rest" in
              sha256:*) ;;
              *) if [ -n "$$rest" ]; then key="$$rest"; break; fi ;;
            esac
          done
        fi
        if [ -z "$$key" ]; then
          echo "No usable API_KEY or plaintext API_KEYS entry found for Prometheus to scrape /metrics" >&2
          exit 1
        fi
        umask 077 && printf '%s' "$$key" > /prometheus-secrets/api_key &&
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=30d
    environment:
      # Same keys as the api/ui services use; at least one must resolve to a usable plaintext key
      API_KEY: ${API_KEY:-}
      API_KEYS: ${API_KEYS:-}
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"
    networks: [backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  grafana:
    image: grafana/grafana:11.3.1@sha256:fa801ab6e1ae035135309580891e09f7eb94d1abdbd2106bdc288030b028158c
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env (see .env.example)}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: "false" # served over plain HTTP on localhost (or an SSH tunnel)
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/resume-screener.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    depends_on:
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

volumes:
  prometheus-data:
  grafana-data:

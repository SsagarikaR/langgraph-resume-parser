[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-resume-parser"
version = "0.1.0"
description = "Screens a resume against a job description with a LangGraph workflow on Gemini"
readme = "README.md"
requires-python = ">=3.10"
# Versions tested together; bump deliberately
dependencies = [
    "langgraph~=1.2.12",
    "langgraph-checkpoint-sqlite~=3.1.1",
    "langchain~=1.4.3",
    "langchain-core~=1.6.5",
    "langchain-google-genai~=4.4.0",
    "pydantic~=2.13.5",
    "pydantic-settings~=2.15.0",
    "pypdf~=6.21.1",  # 6.19.0 had 5 known CVEs (CVE-2026-113786/792/793/794/795), all fixed by 6.21.1
    "fastapi~=0.142.2",
    "uvicorn~=0.54.0",
    "python-multipart~=0.0.32",
    "qdrant-client~=1.19.1",
]

[project.optional-dependencies]
ui = [
    "streamlit~=1.65.0",
    "requests~=2.34.2",
]
dev = [
    "langgraph-resume-parser[ui]",
    "pytest~=9.1.1",
    "httpx~=0.28.1",
    "pytest-cov~=7.0",
    "ruff~=0.16.10",
    "mypy~=1.20.2",
    "types-requests~=2.32",
    "pre-commit~=4.3",
]

[project.scripts]
resume-screener = "app.cli:main"
resume-screener-ingest = "app.knowledge.ingest:main"

[tool.setuptools.packages.find]
include = ["app*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["app", "ui"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80  # CI fails if coverage drops below this

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# S = bandit security checks, SIM/C4/RUF = simplifications and common pitfalls
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "SIM", "C4", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # typographic characters (– …) in text are intentional

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "S108"]  # asserts, fake secrets and fake paths are expected in tests
"evals/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
files = ["app", "evals", "ui"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true
